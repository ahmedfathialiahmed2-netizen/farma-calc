<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14325a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>حاسبة الميل وعرض الفرمة وطبقات الطريق | أحمد فتحي</title>
<style>
:root{--bg:#eef1f5;--card:#fff;--ink:#14243b;--mute:#5b6b80;--line:#d6dde7;--navy:#14325a;--navy2:#1d4a82;--yel:#f2b705;--soft:#e8eff8;--warn:#c2410c;--onnavy:#fff;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1622;--card:#17233a;--ink:#e9eef6;--mute:#9db0c9;--line:#2a3a56;--navy:#0b1830;--navy2:#2d6bb5;--soft:#1e2f4d;--warn:#f08a4b}}
:root[data-theme="dark"]{--bg:#0e1622;--card:#17233a;--ink:#e9eef6;--mute:#9db0c9;--line:#2a3a56;--navy:#0b1830;--navy2:#2d6bb5;--soft:#1e2f4d;--warn:#f08a4b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;line-height:1.6}
header{background:var(--navy);color:var(--onnavy);padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 22px;border-bottom:4px solid var(--yel)}
.hd{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:14px}
.logo{width:84px;height:84px;border-radius:50%;background:#fff;flex:none;border:3px solid var(--yel);object-fit:cover}
.hd h1{font-size:1.2rem;margin:0;line-height:1.35}
.hd p{margin:2px 0 0;font-size:.9rem;opacity:.85}
.hd .nm{font-size:1.05rem;color:var(--yel);font-weight:700}
main{max-width:680px;margin:0 auto;padding:16px}
h2{font-size:1.05rem;margin:0 0 12px;padding-right:10px;border-right:4px solid var(--yel)}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:.86rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;direction:ltr;text-align:center}
select{direction:rtl;text-align:right}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.slope{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.slope span{font-size:1.4rem;color:var(--mute)}
.res{background:var(--soft);border-radius:10px;padding:12px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border:0}
.row b{white-space:nowrap;direction:ltr;font-size:1.05rem;color:var(--navy2)}
.row.tot{margin-top:4px;padding:10px;background:var(--navy);color:#fff;border-radius:8px;border:0}
.row.tot b{color:var(--yel);font-size:1.3rem}
.steps{font-size:.88rem;color:var(--mute);margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.steps div{margin-bottom:3px}
.num{direction:ltr;unicode-bidi:isolate;display:inline-block;color:var(--ink);font-weight:600}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
th{background:var(--navy);color:#fff;font-weight:600;padding:8px 5px;white-space:nowrap}
th:first-child{border-radius:0 8px 0 0}th:last-child{border-radius:8px 0 0 0}
td{padding:6px 5px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
td input{padding:7px;min-width:62px}
td.nm input{text-align:right;direction:rtl;min-width:120px}
td.tt{font-weight:700;color:var(--navy2)}
button{font:inherit;border:1px solid var(--navy2);background:transparent;color:var(--navy2);border-radius:8px;padding:8px 14px;cursor:pointer}
button.pri{background:var(--yel);border-color:var(--yel);color:#14243b;font-weight:700}
button.x{border-color:var(--warn);color:var(--warn);padding:3px 10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
.note{font-size:.82rem;color:var(--mute);margin-top:10px}
footer{text-align:center;padding:6px 16px 28px;color:var(--mute);font-size:.85rem}
footer b{color:var(--ink)}
</style>
</head>

<script>
var $=function(i){return document.getElementById(i)};
var layers=[{n:"طبقة السطح (أسفلت)",t:5},{n:"طبقة الرابطة",t:7},{n:"الأساس",t:20},{n:"تحت الأساس",t:25}];
function f(x){return (Math.round(x*1000)/1000).toString()}
function nv(id){var v=parseFloat($(id).value);return isNaN(v)?0:v}
function slope(){var h=nv("sh"),v=nv("sv");return v?h/v:0}
function N(x){return '<span class="num">'+x+'</span>'}
function calc1(){
 var k=slope(),s=parseFloat($("dir").value),d=nv("dp")/100,e=d*k*s,r=nv("wr"),l=nv("wl");
 var sg=s>0?"+":"−",ab=Math.abs(e);
 $("out1").innerHTML='<div class="row"><span>الزيادة/النقص في كل جانب</span><b>'+f(e)+' م</b></div>'+
 '<div class="row"><span>Right بعد التعديل</span><b>'+f(r+e)+' م</b></div>'+
 '<div class="row"><span>Left بعد التعديل</span><b>'+f(l+e)+' م</b></div>'+
 '<div class="row tot"><span>العرض الإجمالي</span><b>'+f(r+l+2*e)+' م</b></div>';
 $("st1").innerHTML='<div>١) الميل = '+N(f(nv("sh"))+' ÷ '+f(nv("sv"))+' = '+f(k))+'</div>'+
 '<div>٢) المقدار لكل جانب = '+N(f(nv("dp")/100)+' × '+f(k)+' = '+f(ab))+' م</div>'+
 '<div>٣) Right = '+N(f(r)+' '+sg+' '+f(ab)+' = '+f(r+e))+'</div>'+
 '<div>٤) Left = '+N(f(l)+' '+sg+' '+f(ab)+' = '+f(l+e))+'</div>'+
 '<div>٥) الإجمالي = '+N(f(r+l+2*e))+' م. تقسيم الفرمة يمين/يسار لا يغيّر الإجمالي لو الميل واحد.</div>';
 calc2();
}
function calc2(){
 var k=slope(),s=parseFloat($("dir").value),r=nv("wr"),l=nv("wl"),cum=0,h="";
 layers.forEach(function(L,i){
  cum+=L.t;var e=cum/100*k*s;
  h+='<tr><td class="nm"><input value="'+L.n.replace(/"/g,"&quot;")+'" data-i="'+i+'" data-k="n"></td>'+
  '<td><input lang="en" type="number" step="any" inputmode="decimal" value="'+L.t+'" data-i="'+i+'" data-k="t"></td>'+
  '<td>'+f(cum)+'</td><td>'+f(r+e)+'</td><td>'+f(l+e)+'</td><td class="tt">'+f(r+l+2*e)+'</td>'+
  '<td><button class="x" data-del="'+i+'" aria-label="حذف">×</button></td></tr>';
 });
 $("tb").innerHTML=h;
}
$("tb").addEventListener("change",function(e){
 var t=e.target;if(t.dataset.k){var L=layers[+t.dataset.i];if(t.dataset.k==="n")L.n=t.value;else L.t=parseFloat(t.value)||0;calc2()}
});
$("tb").addEventListener("click",function(e){
 var d=e.target.dataset.del;if(d!==undefined){layers.splice(+d,1);calc2()}
});
$("add").onclick=function(){layers.push({n:"طبقة جديدة",t:10});calc2()};
["wr","wl","sh","sv","dir","dp"].forEach(function(i){$(i).addEventListener("input",calc1)});
calc1();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
